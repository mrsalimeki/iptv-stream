name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm list @capacitor/core @capacitor/cli

      - name: Build web app
        run: npm run build

      - name: List dist folder
        run: ls -la dist/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          npx cap add android --verbose
        continue-on-error: true

      - name: Check android folder
        run: |
          ls -la
          ls -la android/ || echo "Android folder not found"

      - name: Sync Capacitor
        run: |
          if [ -d "android" ]; then
            npx cap sync android
          else
            echo "Skipping sync - android folder doesn't exist"
            exit 1
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Stream-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7